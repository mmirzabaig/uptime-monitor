apiVersion: apps/v1
kind: Deployment

metadata:
  name: uptime-monitor

spec:
  replicas: 1

  selector:
    matchLabels:
      app: uptime-monitor

  template:
    metadata:
      labels:
        app: uptime-monitor

    spec:
      containers:
        - name: uptime-monitor
          image: uptime-monitor-go-uptime-monitor:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: uptime-monitor-config
                  key: SERVER_ADDR
          
          readinessProbe:
            httpGet:
              path: /monitors
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /monitors
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /monitors
              port: 8080

            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12